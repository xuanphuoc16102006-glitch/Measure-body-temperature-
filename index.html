<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThermoSync • Smart Health Check-in</title>
  <!-- Font chữ hiện đại chuẩn GenZ UI -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Thư viện quét mã QR trực tiếp qua Webcam -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f6f8fd 0%, #eef2ff 50%, #fdf4ff 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.7);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --secondary-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      --normal: #10b981;
      --normal-bg: #d1fae5;
      --fever: #f43f5e;
      --fever-bg: #ffe4e6;
      --text-main: #0f172a;
      --text-sub: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      padding: 28px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    /* Header phong cách hiện đại */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 99px;
      background: rgba(99, 102, 241, 0.1);
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 50%, #db2777 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      margin: 6px 0 0;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 500;
    }

    /* Bento Grid Layout */
    .bento-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      .bento-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 35px -10px rgba(99, 102, 241, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease;
    }

    /* Nút bấm */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
    }
    button {
      font-family: inherit;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:active { transform: scale(0.96); }

    .btn-connect {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
    }
    .btn-connect:hover { opacity: 0.93; transform: translateY(-1px); }

    .btn-disconnect {
      background: #475569;
      color: white;
      display: none;
    }
    .btn-qr {
      background: var(--secondary-gradient);
      color: white;
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.25);
    }
    .btn-add {
      background: #0f172a;
      color: white;
      padding: 10px 15px;
    }
    .btn-export {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .btn-clear {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-clear:hover { background: #e2e8f0; }

    /* Badges trạng thái */
    .badge-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      background: #f1f5f9;
      color: #475569;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .status-connected { background: var(--normal-bg); color: #065f46; }
    .status-connected .dot { background: var(--normal); box-shadow: 0 0 8px var(--normal); }
    .status-cloud { background: #e0e7ff; color: #3730a3; }
    .status-cloud .dot { background: #6366f1; }

    /* Hiển thị nhiệt độ trung tâm */
    .temp-box {
      text-align: center;
      padding: 16px 12px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(248,250,252,0.9) 100%);
      border: 1px solid #e2e8f0;
      margin: 14px 0;
    }
    .current-person-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 99px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 13px;
      font-weight: 700;
    }
    .temp-display {
      font-size: 74px;
      font-weight: 800;
      letter-spacing: -2px;
      margin: 8px 0 4px;
      color: var(--normal);
      line-height: 1.05;
      transition: all 0.3s ease;
    }
    .alert-text {
      font-size: 15px;
      font-weight: 700;
      min-height: 22px;
    }
    .threshold-box {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .threshold-box input {
      width: 68px;
      padding: 5px 8px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      text-align: center;
      color: var(--text-main);
      outline: none;
    }
    .threshold-box input:focus { border-color: var(--primary); }

    /* Khối định danh sinh viên bên phải */
    .section-title {
      font-size: 16px;
