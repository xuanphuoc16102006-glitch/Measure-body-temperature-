<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Giám Sát Thân Nhiệt BLE & Cloud</title>
  <style>
    :root {
      --primary: #2563eb;
      --normal: #10b981;
      --fever: #ef4444;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 750px; width: 100%; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 24px; color: #0f172a; }
    .header p { margin: 5px 0 0; color: #64748b; font-size: 14px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
      text-align: center;
    }
    .controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-connect { background: var(--primary); color: white; }
    .btn-connect:hover { background: #1d4ed8; }
    .btn-disconnect { background: #64748b; color: white; display: none; }
    .btn-export { background: #059669; color: white; }
    .btn-clear { background: #e2e8f0; color: #334155; }
    
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: #e2e8f0;
      color: #475569;
      margin: 4px;
    }
    .status-connected { background: #dcfce7; color: #166534; }
    .status-cloud { background: #dbeafe; color: #1e40af; }

    .temp-display {
      font-size: 76px;
      font-weight: 800;
      margin: 20px 0 10px;
      color: var(--normal);
      transition: color 0.3s;
    }
    .alert-text { font-size: 18px; font-weight: 700; height: 28px; margin-bottom: 10px; }
    .threshold-box { margin-top: 15px; font-size: 14px; color: #475569; }
    .threshold-box input {
      width: 60px; padding: 4px 8px; font-size: 14px;
      border: 1px solid #cbd5e1; border-radius: 6px; text-align: center;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center; }
    th { background-color: #f8fafc; color: #475569; font-weight: 600; }
    .tag-ok { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
    .tag-fever { background: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>GIÁM SÁT THÂN NHIỆT KHÔNG TIẾP XÚC</h1>
    <p>ATmega328P • MLX90614 • BLE HM-10 & Giám sát từ xa Cloud</p>
  </div>

  <div class="card">
    <div class="controls">
      <button id="btnConnect" class="btn-connect" onclick="connectBLE()">🔗 Kết nối Trạm đo (HM-10)</button>
      <button id="btnDisconnect" class="btn-disconnect" onclick="disconnectBLE()">❌ Ngắt BLE</button>
    </div>
    
    <div>
      <span id="statusBadge" class="status-badge">Chế độ: Xem từ xa (Cloud)</span>
      <span id="syncTime" class="status-badge status-cloud">Đang đồng bộ...</span>
    </div>

    <div id="tempValue" class="temp-display">--.- °C</div>
    <div id="alertText" class="alert-text" style="color: #64748b;">Đang chờ dữ liệu...</div>

    <div class="threshold-box">
      Ngưỡng cảnh báo sốt: 
      <input type="number" id="feverThreshold" value="37.5" step="0.1"> °C
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
      <h3 style="margin: 0;">Lịch sử đo gần đây</h3>
      <div>
        <button class="btn-export" onclick="exportCSV()">📥 Xuất Excel (CSV)</button>
        <button class="btn-clear" onclick="clearHistory()">🗑️ Xóa bảng</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>STT</th>
          <th>Thời gian</th>
          <th>Nhiệt độ (°C)</th>
          <th>Đánh giá</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr><td colspan="4" style="color: #94a3b8;">Chưa có dữ liệu đo</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const FIREBASE_DB_URL = "https://measure-body-temperature-default-rtdb.asia-southeast1.firebasedatabase.app/";

  let bleDevice = null;
  let bleCharacteristic = null;
  let receiveBuffer = "";
  let historyData = [];
  let isHostStation = false;
  let lastCloudTimestamp = 0;

  const SERVICE_UUID = 0xFFE0;
  const CHAR_UUID = 0xFFE1;

  // 1. KẾT NỐI BLUETOOTH (Dành cho máy tính đặt cạnh mạch đo)
  async function connectBLE() {
    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }]
      });
      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
      
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      bleCharacteristic = await service.getCharacteristic(CHAR_UUID);

      await bleCharacteristic.startNotifications();
      bleCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

      isHostStation = true;
      document.getElementById('statusBadge').innerText = "Trạm phát: Đã nối " + (bleDevice.name || "HM-10");
      document.getElementById('statusBadge').classList.add('status-connected');
      document.getElementById('btnConnect').style.display = 'none';
      document.getElementById('btnDisconnect').style.display = 'inline-block';
    } catch (error) {
      alert("Lỗi kết nối BLE: " + error.message);
    }
  }

  function disconnectBLE() {
    if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
  }

  function onDisconnected() {
    isHostStation = false;
    document.getElementById('statusBadge').innerText = "Chế độ: Xem từ xa (Cloud)";
    document.getElementById('statusBadge').classList.remove('status-connected');
    document.getElementById('btnConnect').style.display = 'inline-block';
    document.getElementById('btnDisconnect').style.display = 'none';
  }

  function handleBLEData(event) {
    const chunk = new TextDecoder().decode(event.target.value);
    receiveBuffer += chunk;
    if (receiveBuffer.includes('\n')) {
      const lines = receiveBuffer.split('\n');
      receiveBuffer = lines.pop();
      for (let line of lines) {
        const match = line.trim().match(/[-+]?\d*\.\d+|\d+/);
        if (match) {
          const temp = parseFloat(match[0]);
          if (!isNaN(temp) && temp > 10 && temp < 60) {
            const nowTs = Date.now();
            updateDashboard(temp, nowTs);
            pushToCloud(temp, nowTs);
          }
        }
      }
    }
  }

  // 2. ĐẨY DỮ LIỆU LÊN FIREBASE CLOUD
  async function pushToCloud(temp, timestamp) {
    try {
      await fetch(`${FIREBASE_DB_URL}latest.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ temp: temp, timestamp: timestamp })
      });
      document.getElementById('syncTime').innerText = "Đã đẩy lên Cloud: " + new Date(timestamp).toLocaleTimeString('vi-VN');
    } catch (e) {
      document.getElementById('syncTime').innerText = "Lỗi đồng bộ Cloud";
    }
  }

  // 3. TỰ ĐỘNG KÉO DỮ LIỆU TỪ CLOUD (Dành cho thiết bị ở xa)
  setInterval(async () => {
    if (isHostStation) return;
    try {
      const res = await fetch(`${FIREBASE_DB_URL}latest.json`);
      const data = await res.json();
      if (data && data.temp && data.timestamp !== lastCloudTimestamp) {
        lastCloudTimestamp = data.timestamp;
        updateDashboard(data.temp, data.timestamp);
        document.getElementById('syncTime').innerText = "Cập nhật từ xa lúc: " + new Date(data.timestamp).toLocaleTimeString('vi-VN');
      }
    } catch (e) {
      console.log("Đang chờ dữ liệu Cloud...");
    }
  }, 1500);

  // 4. CẬP NHẬT GIAO DIỆN & BẢNG LỊCH SỬ
  function updateDashboard(temp, timestamp) {
    const threshold = parseFloat(document.getElementById('feverThreshold').value) || 37.5;
    const isFever = temp >= threshold;

    const tempEl = document.getElementById('tempValue');
    const alertEl = document.getElementById('alertText');
    tempEl.innerText = temp.toFixed(1) + " °C";
    
    if (isFever) {
      tempEl.style.color = "var(--fever)";
      alertEl.style.color = "var(--fever)";
      alertEl.innerText = "⚠️ CẢNH BÁO: PHÁT HIỆN THÂN NHIỆT CAO!";
    } else {
      tempEl.style.color = "var(--normal)";
      alertEl.style.color = "var(--normal)";
      alertEl.innerText = "✅ Thân nhiệt bình thường";
    }

    const timeStr = new Date(timestamp).toLocaleTimeString('vi-VN');
    historyData.unshift({ time: timeStr, temp: temp.toFixed(1), isFever: isFever });
    if (historyData.length > 50) historyData.pop();
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('historyBody');
    if (historyData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="color: #94a3b8;">Chưa có dữ liệu đo</td></tr>';
      return;
    }
    tbody.innerHTML = historyData.map((item, index) => `
      <tr>
        <td>${historyData.length - index}</td>
        <td>${item.time}</td>
        <td><strong>${item.temp} °C</strong></td>
        <td>${item.isFever ? '<span class="tag-fever">Sốt cao</span>' : '<span class="tag-ok">Bình thường</span>'}</td>
      </tr>
    `).join('');
  }

  function clearHistory() { historyData = []; renderTable(); }

  function exportCSV() {
    if (historyData.length === 0) return alert("Chưa có dữ liệu để xuất!");
    let csvContent = "\uFEFFSTT,Thoi gian,Nhiet do (C),Trang thai\n";
    historyData.forEach((item, index) => {
      csvContent += `${historyData.length - index},${item.time},${item.temp},${item.isFever ? "Sot cao" : "Binh thuong"}\n`;
    });
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Lich_su_do_than_nhiet.csv";
    link.click();
  }
</script>
</body>
</html>
